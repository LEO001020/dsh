# The dsh-daily-work bundle patch.
#
# This file is what makes the package a BUNDLE rather than a plain dependency.
# Without `dsh.bundle.patch` in package.json, `dsh plugin add` installs the code
# but activates NO layer, and the profile silently boots without it. That is
# exactly what happened before this file existed: the host started, printed
# "1 entry did not activate", and ran with no work service at all.
#
# Everything here is ONE explainable difference from the stock composition.

# ---------------------------------------------------------------------------
# DIFFERENCE 1 (mandatory): raise continuable-child capacity to the user's N.
# ---------------------------------------------------------------------------
#
# MEASURED GAP, not an assumption. `--dump-default-config` for every shipped
# profile shows `id: subagent` with NO config block, so `maxActiveSubagents`
# falls back to the Schemastery default 8
# (packages/subagent/subagent/src/index.ts:200-201). N=10 is therefore NOT
# satisfiable by any stock profile. Evidence:
# qualification/results/M0.5-c0-resolved-graph/C0-resolved-graph.md
#
# BOTH keys are restated because a patch replaces the target row's WHOLE
# `config` object; it is not a deep merge (vendor/include/src/index.ts:120-123).
# Omitting `maxDepth` would silently reset it to the schema default.
#
# `maxDepth: 1` is load-bearing: it allows the ten direct children and forbids
# them from opening unbilled grandchildren.
- id: subagent
  config:
    # The user's chosen N. Root is NOT counted in this number.
    maxActiveSubagents: 10
    # 1 = direct children only, for the paths this setting actually reaches.
    #
    # MEASURED LIMIT, corrected after an over-claim: `maxDepth` is a
    # CALLER-SUPPLIED CAP, and an OMITTED cap is NOT a refusal. From a depth-1
    # child, `maxDepth: 1` refuses, but `maxDepth: 99` AND an omitted `maxDepth`
    # BOTH create a depth-2 child. So this setting bounds only callers that pass
    # it.
    #
    # What DSH itself enforces is depth ACCOUNTING from the parent's persisted
    # header (`delegationDepthOf` is a monotone floor), so no caller can delegate
    # lower than its own depth. That is real, but it is not a policy ceiling.
    #
    # This project's own limit is a SECOND, INDEPENDENT gate: `maxDepth` is
    # written into every RunRecord from HOST config, never from a request, and
    # `src/launch-port.ts` hard-codes `maxDepth: deps.maxDepth`, so the omission
    # path is unreachable through this project.
    #
    # NOT COVERED, and stated rather than implied: the workflow/PTC path.
    # `packages/workflow/workflow-ptc/src/host.ts` `startChild` calls
    # `subagents.start()` with NO `maxDepth`, so a workflow launched from a
    # depth-1 child creates a depth-2 child. Our launches are bounded; a
    # workflow's are not. See docs/GAPS.md G-SEAM-18.
    maxDepth: 1

# ---------------------------------------------------------------------------
# DIFFERENCE 2 (mandatory): mount the work host service.
# ---------------------------------------------------------------------------
#
# Mounted ONCE, at host level, because the run record is a host-scoped resource:
# a second handle would duplicate the single-writer assumption the storage
# domain explicitly does not enforce.
#
# The config values are USER-AUTHORIZED defaults. They are not writable by the
# model: the model has a `work` tool, but that tool cannot reach these fields.
- insert:
    - id: daily-work-host
      name: dsh-daily-work/host
      config:
        targetChildren: 10
        maxDepth: 1
        # The continuable-child provider the PRODUCTION launch port launches
        # through. The base bundle mounts `subagent-spawn-in-process` and sets
        # `subagentProvider: spawn` for its own rows; naming it here is what lets
        # the work service reach the real seam without hardcoding a provider.
        subagentProvider: spawn
        budgetCeiling: 200
        currency: USD
        priceVersion: unversioned-2026-09-19

# ---------------------------------------------------------------------------
# DIFFERENCE 3: the ported web-search provider, registered through ctx.web.
# ---------------------------------------------------------------------------
#
# Optional by construction: if the credential reference is not configured, the
# provider reports `available() === false` and the host degrades to "search
# unavailable" rather than failing to boot. The reference is NAMED here; no
# credential value is ever placed in configuration.
- insert:
    - id: daily-web-search
      name: dsh-daily-work/web-search
      config:
        id: daily-search
        endpoint: https://api.exa.ai/search
        apiKeyEnv: EXA_API_KEY
        maxResults: 60

# ---------------------------------------------------------------------------
# DIFFERENCE 3b (mandatory): mount the M7 history + provenance service.
# ---------------------------------------------------------------------------
#
# WHY A PLUGIN ROW AND NOT JUST A MODULE. `src/history-plane.ts` and
# `src/web-provenance.ts` are the M7 implementation, and a module with no
# production importer is test-only: mounting it directly in a test proves it
# works, NOT that the product uses it. This project has already retracted that
# over-claim three times (a launch port with no production caller, a continuation
# taker with none, and a package with no `dsh.bundle`), so the row below is what
# makes `ctx.dailyHistory` reachable by a real profile rather than by a test.
#
# The service is reachable as `ctx.dailyHistory` and owns:
#   - `history(caller)`      an authorized `HistoryPlane` over `ctx.sessionQuery`
#   - `recordFetch(...)`     a provenance record for a real `ctx.web.fetch` result
#   - `recordSearch(...)`    a search record whose coverage is a RANKING, not exhaustion
#   - `untrusted(...)`       retrieved content carried as data, never as authority
#
# NO `inject` ON sessionQuery, deliberately. The shipped profile configures
# `session-query-sqlite` with `openAt: never`, and a deployment may omit the
# service entirely; `inject` would turn that into a boot failure. The dependency
# is resolved per call, so a missing service produces a typed refusal naming the
# DEPLOYMENT as the cause instead of an empty history that reads as "no events".
- insert:
    - id: daily-history
      name: dsh-daily-work/history

# ---------------------------------------------------------------------------
# DIFFERENCE 4 (mandatory): mount the exact-owner guard for the `work` tool.
# ---------------------------------------------------------------------------
#
# WHY THIS IS NOT OPTIONAL. `tools.ts` resolves a run for a calling Agent by
# STRING comparison of the session id. A SessionId is reused across an agent's
# life: `AgentRegistry.resume` publishes a NEW Agent object under the SAME id,
# so a callback still holding the PREVIOUS lifecycle's object passes the string
# test and writes authoritative state into the run the new lifecycle now owns.
#
# MEASURED (qualification/results/M9.11-tool-protocol/): after a resume,
# `ctx.agents.get(id) === oldAgent` is false while
# `String(oldAgent.id) === String(newAgent.id)` is true. A paired test shows the
# stale object driving `finish` and moving the run to `closing` when this guard
# is absent.
#
# Mounted at the HOST plane on purpose: a plain-context guard applies globally
# (packages/core/tools/src/index.ts:1107-1119), which is the deployment-wide
# intent. A guard registered through an `agent.ctx` would cover one agent only.
#
# It registers through `ctx.tools.guard`, the MONOTONIC slot, and not through
# `tools/pre-execute`, where a later listener could return `allow` and restore
# permission. Guards have no allow result, so ordering cannot undo a denial.
- insert:
    - id: daily-work-tool-protocol-guards
      name: dsh-daily-work/tool-protocol-guards

# ---------------------------------------------------------------------------
# DIFFERENCE 5 (mandatory): mount the writer-isolation and integration service.
# ---------------------------------------------------------------------------
#
# WHY A PLUGIN ROW AND NOT JUST A MODULE. `src/worktree-isolation.ts` is the M8
# implementation of ARCHITECTURE §15 ("root是主整合者；每个writer child拥有自己的隔离
# worktree/快照。git worktree不是安全边界"), and until this row existed it had NO
# production importer: mounting it directly in a test proved it works and proved
# nothing about whether the product uses it. This project has retracted that
# over-claim four times now:
#
#   1. `setLaunchPort` had no production caller, so the shipped profile launched
#      nothing and every `submit` became `unknown` (2d4534f).
#   2. `takeContinuation` had none, so a managed run never disarmed the Goal
#      round-driver and TWO continuation owners could drive one root while
#      `goal.test.ts` passed (982e82b).
#   3. `dsh-ipython` declared no `dsh.bundle`, so the package could never reach
#      the model even with green tests.
#   4. This module.
#
# `docs/GAPS.md` G-FIX-04 states the lesson: an oracle weaker than its scenario
# passes while the product is broken. The row below is what makes
# `ctx.dailyWriters` reachable by a real profile rather than only by a test.
#
# The service is reachable as `ctx.dailyWriters` and owns:
#   - `open(...)`        create ONE writer's isolated worktree/clone and return a
#                        lease; refuses a second writer on the same workspace
#   - `converge(...)`    converge + digest a workspace BEFORE the freeze, refusing
#                        an in-flight writer (the step the runner cannot take)
#   - `verifyShared(...)` re-read the shared git refs/config/hooks a writer is
#                        able to mutate but git does not deny
#   - `assess(...)`      judge one candidate: base revision, patch applies,
#                        workspace change scope, real tests, receipt bindings
#   - `publicationPrecondition(...)`  exact-base patch + expected-ref CAS
#
# NO MERGE PATH EXISTS. Every mutating git command it can reach is a
# workspace-lifecycle operation scoped to a workspace it created. `git apply` is
# used with `--check` only and never `--3way`, so a conflict is RETURNED to the
# root as a refusal rather than auto-resolved — the plan is explicit that a
# semantic auto-merge controller must not be written.
#
# NO `root` CONFIG IS SET HERE, deliberately. The integration root is a
# per-deployment path and the service REFUSES to guess one: a guessed root is a
# service that could operate on the wrong repository. `available()` reports the
# gap, and a caller passes a root explicitly.
- insert:
    - id: daily-writers
      name: dsh-daily-work/writers

# ---------------------------------------------------------------------------
# NOT changed here, on purpose.
# ---------------------------------------------------------------------------
#
# - The Goal service stays mounted. Managed-work mode takes continuation for a
#   single root through the public ctx.goals.disarm at run creation; the durable
#   objective is not cleared and completion is not faked. Removing the Goal row
#   would be deleting a stock component and then calling the result stock.
#
# - Planning tools, workflow, sub-agents and the browser roster stay as shipped.
#
# - session-query-sqlite stays at ':memory:' / openAt: never, the shipped value.
#   Full-text session search is a separate decision with its own evidence need.
#
# - The storage backend stays `json`. Switching to SQLite because the substrate
#   "should" be a database is exactly what the plan forbids.

# ---------------------------------------------------------------------------
# DIFFERENCE 5 (mandatory): mount the observation/artifact data plane.
# ---------------------------------------------------------------------------
#
# WHY THIS ROW EXISTS AT ALL. Without it, `artifacts.ts` and `observations.ts`
# are TEST-ONLY: they have no production importer, so the only thing proving
# they work is a test that mounts them directly. That proves the MODULE works and
# says nothing about whether the PRODUCT uses it -- the defect class this project
# has already recorded three times (setLaunchPort with no production caller;
# takeContinuation with no production caller; a dsh-ipython bundle with no
# `dsh.bundle`). `docs/GAPS.md` G-FIX-04 states the lesson: a gate whose oracle
# is weaker than its scenario passes while the product is broken.
#
# The service registers as `ctx.dailyData`. Its intended model-facing caller is
# the M3 `python_exec`/`ipython` worker's `data.capture_file` / `data.pages`
# tools; the service is the stable seam that worker binds to, and it is complete
# and probeable without it.
#
# `artifactRoot` is deliberately NOT set here. The service derives its root from
# the storage domain's own configured root, so artifacts live beside the records
# that reference them. Setting it in the patch would create a second, separately
# configured tree to keep in sync.
- insert:
    - id: daily-data-plane
      name: dsh-daily-work/data-host
      config:
        # The owner scope every capture and cursor is bound to. A permission
        # domain change bumps this scope's revision and invalidates every
        # descriptor minted before it.
        ownerScope: project:daily
        # The execution world recorded on descriptors. `local` is what the
        # composed profile's fs backend actually is; naming it here keeps the
        # recorded fact honest rather than implied.
        executionWorld: local
        # 64 KiB pages: a 32 MiB artifact is exactly 512 pages, which is the
        # DAT-02 stimulus, and one page is never a context-budget problem alone.
        pageBytes: 65536
        # Per-artifact ceiling. Exceeding it is a recorded retention gap and a
        # `partial` observation -- never a silent fallback to unbounded inline.
        quotaBytes: 268435456

# ---------------------------------------------------------------------------
# DIFFERENCE 6 (mandatory): mount the public programmatic-call scope service.
# ---------------------------------------------------------------------------
#
# WHY THIS ROW EXISTS. `src/programmatic-scope.ts` is the M2 extraction of the
# nested-dispatch machinery that stock `run_code` already implements inside
# `packages/core/tools/src/ptc.ts`. It is built on the PUBLIC `ToolRuntime`
# surface -- `registry.execute` is the registry's own composition of the SAME
# four staged functions the private `TOOL_RUNTIME_SCHEDULER` symbol exposes, so
# no upstream patch is required and none was made. Until this row existed, the
# scope had no production importer: mounting it directly in a test would prove
# it works and prove NOTHING about whether the product uses it. That is the
# G-FIX-04 defect class this project has already shipped three times
# (`setLaunchPort` and `takeContinuation` both had zero production callers, and
# a plugin with no `dsh.bundle` never reached the model).
#
# WHO CONSUMES IT. The M3 `python_exec` cell. When the IPython kernel's
# native-tool callback arrives, the cell handler asks this service for a scope
# bound to the ENCLOSING execution and routes every `tools.<name>(...)` call
# through it; `observations.call` in the architecture's Python SDK is the same
# call with `delivery: 'reference'`. Actor, Session, parent execution and policy
# are construction inputs taken from the host call site, never from the program.
#
# WHY IT ADDS NO MODEL-FACING TOOL. The model's execution surface stays exactly
# what the profile already composes. A second tool that could call tools would
# be the "second tool-bridge engine" MASTER_EXECUTION_PLAN M2 forbids.
#
# The bounds are the scope's own defaults, restated so the composed profile
# states them: 10 overlapping top-level calls (the registry's own
# `maxParallelSubCalls` default), 64 KiB of canonical JSON per `value` delivery,
# 4096 characters per control notice, 64 direct notices before coalescing.
- insert:
    - id: daily-programmatic-scope
      name: dsh-daily-work/programmatic-scope
      config:
        maxParallel: 10
        valueBudgetBytes: 65536
        noticeChars: 4096
        noticeLimit: 64
        # `reference` keeps bulk payloads (for example a large image) OUT of
        # model context and retains them as auditable references. `defer-images`
        # reproduces stock `run_code` behaviour; it exists so the two transports
        # can be compared on one registry, not as the daily default.
        contentProjection: reference
    - id: daily-no-sandbox-contract
      name: dsh-daily-work/no-sandbox-contract
