# C4 ID-01 overlay: the archived ID-01 composition, with the two inserted rows
# re-pointed at THIS worktree's copies of the T17 instruments.
#
# WHY A COPY RATHER THAN EDITING THE ARCHIVED FILE. The archived overlay under
# `qualification/results/V1-identity/overlays/id01-overlay.yml` is EVIDENCE for a
# run recorded under a previous deployment identity, and it names the MAIN
# checkout's instruments by absolute path. Editing it would change the evidence
# for that run. This file is the same composition with only the two `insert`
# names moved, so the graph measured here is the graph of THIS tree.
#
# EVERYTHING ELSE IS IDENTICAL, including the keyless mock route. That means this
# is a CONTROLLED LOCAL ROUTE: it consumes no provider budget and proves the
# module graph and the tool chain, NOT a provider integration.
#
# The rows below are the archived ones: llm-deepseek disabled (so a missing key
# cannot be mistaken for a result), the route moved to the keyless adapter, the
# session root moved to a path this driver owns, and agent-instructions
# disabled. The two probes INSERT NO SERVICE AND NO TOOL ROW, so the catalog the
# probe reads is the catalog the PRODUCT composes.

- id: llm-deepseek
  disabled: true

- id: agent-default-model
  config:
    provider: t17-mock
    model: t17-mock

- id: session-persistence-jsonl
  config:
    root: !!js process.env.T17_SESSION_ROOT
    compression: none

- id: agent-instructions
  disabled: true

- insert:
    - id: t17-first-call-adapter
      name: 'D:/DSH/work/wt-c4/qualification/results/T17-identity/first-call-adapter.mjs'

- insert:
    - id: t17-identity-probe
      name: 'D:/DSH/work/wt-c4/qualification/results/T17-identity/probe-plugin.mjs'
