# Overlay for the M4 data-plane boot probe.
#
# Loaded ON TOP of the daily-candidate profile, so the probe runs inside a real
# composed profile boot rather than a hand-mounted context.
#
# TWO rows, for two different reasons:
#
#   1. `daily-data-plane` mounts the data-plane service. It is stated HERE as well
#      as in the package's own `cordis.patch.yml` because the installed profile
#      under DSH_HOME carries a COPY of that file, and a stale copy would make the
#      probe report a false absence -- which is a measurement error about the
#      probe, not a finding about the product. Restating it makes the probe's
#      result depend on the package being built, not on the profile copy's age.
#
#   2. `verify-data-plane` runs the probe itself.
#
# The `fs` service comes from the base bundle; `storageDomain` too, which is what
# lets the data-plane row resolve its `inject`.
#
# The `webserver` override is a PROBE-ENVIRONMENT fact, not a product change: port
# 3080 is held by a long-lived host on this machine, and without the override the
# composed profile fails to boot for a reason that has nothing to do with the data
# plane. Port 0 asks the OS for a free port, so the probe boots on any machine.
# Stated here rather than silently worked around, because a boot that failed for an
# unrelated reason would make every assertion below vacuous.
#
# EVERY key is restated because a patch replaces the target row's whole `config`
# object -- it is not a deep merge (`vendor/include/src/index.ts:120-123`). This is
# TRAP 4 in `docs/OPERATIONS.md`, and it bit this probe on its first run: overriding
# only `port` dropped `host` and the boot failed schema validation.
- id: webserver
  config:
    host: '127.0.0.1'
    port: 0
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024

- insert:
    - id: daily-data-plane
      name: dsh-daily-work/data-host
      config:
        ownerScope: project:daily
        executionWorld: local
        pageBytes: 65536
        quotaBytes: 268435456

    - id: verify-data-plane
      name: 'REWRITTEN-AT-RUN-TIME/qualification/runners/verify-data-plane.mjs'

# THIS FILE IS A TEMPLATE, NOT A RUNNABLE OVERLAY. The probe row's `name:` is a
# PLACEHOLDER rewritten at run time to the RUNNING tree's own probe file. A cordis
# `name:` is a MODULE SPECIFIER and an absolute one is imported as-is
# (`packages/boot/app-boot/src/index.ts:521`,
# `vendor/loader/src/config/tree.ts:122-126`), so a committed literal makes any
# other checkout's boot EXECUTE the main tree's probe -- cross-tree code execution.
# A relative `name:` is not a substitute: the loader resolves it against the
# PROFILE directory, not this file. See `qualification/runners/overlay.mjs`.
# TO RUN THIS OVERLAY, materialise it with the running tree's own probe:
#   import { materialiseOverlay } from './overlay.mjs'
#   materialiseOverlay('<this file>', '<your results dir>/x.patch.yml', '<your probe>.mjs')
# Running it AS-IS fails loudly with an unresolvable module, which is deliberate:
# a loud failure beats silently executing another checkout's probe.
