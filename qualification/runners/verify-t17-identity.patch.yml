# T17 IDENTITY-gate overlay: the model route is redirected to the in-tree KEYLESS
# mock adapter so the round trip can be driven without a live provider.
#
# NO PAID API BUDGET IS CONSUMED. `compatibility.lock.json` carries
# `runtime_authorization.live_provider_budget_authorized: false`, so every run
# that uses this file is a CONTROLLED LOCAL ROUTE, not a provider measurement.
# Anything measured through this file must be labelled as such wherever it is
# cited; it proves the tool/transport/identity chain, not a provider integration.
#
# THE ADAPTER IS THE SHIPPED IN-TREE FIXTURE, referenced by absolute path:
#   packages/test-support/loader-smoke/tests/fixtures/cli-mock-llm.ts
# It is TypeScript that imports `@deepseek-ai/dsh-llm`, and Node resolves that
# bare specifier by walking up from the FILE's directory -- which is why the
# path must point INTO the checkout rather than at a copy under this runner
# directory. A sibling copy fails with `Cannot find package '@deepseek-ai/dsh-llm'`
# (measured and recorded in qualification/results/M9.14-profile-config/FINDINGS.md).
#
# THE `name` VALUE IS AN ENTRY OPTION, NOT ROW CONFIG. The Loader interpolates
# `!!js` inside a row's nested `config` only, so `name: !!js process.env.X` is
# never evaluated and fails with `cli-mock-llm ([object Object]): failed to
# import`. An ABSOLUTE path is the form `anchorInsertedPluginNames`
# (packages/boot/app-boot/src/index.ts:320) rewrites to a file URL.
#
# WRITTEN WITH FORWARD SLASHES ON PURPOSE. This is the G-FIX-11 defect class:
# `\apps\` in a backslash path became BEL (0x07) and `\bin.js` became backspace
# (0x08) once a shell/Python escape pass was applied, and the MANGLED value is
# what got hashed. Forward slashes have no escape to lose.

# `llm-deepseek` is disabled so a missing DEEPSEEK_API_KEY cannot be mistaken for
# a result. If this row were left mounted, the run would fail at the route and a
# reader could not tell "the tool chain is broken" from "there is no key".
- id: llm-deepseek
  disabled: true

# The headless runner takes provider/model from `agentDefaultModel`
# (packages/bundle/headless/src/index.ts: `defaultModel.currentSelection()`),
# NOT from the agent-loop row, so this is the row that must move.
- id: agent-default-model
  config:
    provider: cli-mock
    model: cli-mock

# The persisted Session is the RESUME evidence, so it goes to a path this gate
# owns (supplied through T17_SESSION_ROOT) rather than to the process cwd.
# `compression: none` so the JSONL is readable without a zstd step; the
# production default is compressed and a reader would have to unpack it.
- id: session-persistence-jsonl
  config:
    root: !!js process.env.T17_SESSION_ROOT
    compression: none

# Repo instruction discovery would read whatever cwd this runs in, making the
# request shape a function of the caller's directory instead of the composition.
- id: agent-instructions
  disabled: true

- insert:
    - id: cli-mock-llm
      name: 'D:/DSH/src/dsh-src/packages/test-support/loader-smoke/tests/fixtures/cli-mock-llm.ts'
