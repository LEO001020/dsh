# Overlay for the T3 shell/permission-plane boot probe.
#
# Loaded ON TOP of the `daily-candidate` profile, so the probe runs inside a real
# composed profile boot rather than a hand-mounted context. It ADDS ONE ROW and
# changes nothing else: the composition change under test lives in the PROFILE
# (`profiles/daily-candidate/cordis.patch.yml`, DIFFERENCES 4-6), not here. A
# probe that installed its own subject could not observe the product's
# composition -- and for THIS change that distinction is the whole point, because
# the failure being looked for is a row that is absent from the profile rather
# than one this overlay supplied.
#
# WHY THERE IS NO `webserver` ROW HERE. `boot-harness.mjs` already appends a port
# overlay LAST, and it restates all four keys the row needs (`host`, `port`,
# `compression`, `compressionLevel`) because a patch REPLACES the target row's
# whole `config` object rather than merging into it. A second `webserver` patch
# here would be a competing writer for the same row with no benefit; the harness
# picks a genuinely free port by binding port 0, which is what keeps this probe
# from colliding with the other agents' hosts on 3080.
#
# NO `sandbox` OR `sandbox-policy` ROW EITHER, and that is load-bearing rather
# than an omission. `sandboxPolicy` is injected by five rows that this change
# does NOT touch (terminal-controller, workspace-files, ui-deliverables,
# ptc-runtime-node, workflow-ptc) and `sandbox` by ptc-runtime-node, so removing
# or reconfiguring either here would break their readiness gates and reproduce
# the measured `toolCount: 0` failure (AUDIT-REQUEST fact F) -- which would look
# exactly like the regression this probe is trying to detect, for a reason that
# has nothing to do with it.
#
# NO `approval` ROW HERE EITHER. The `policy: never` pin under test is DIFFERENCE
# 6 in the PROFILE. Restating it in this overlay would make the probe measure its
# own row instead of the profile's, which is the weaker-oracle mistake G-FIX-04
# and G-FIX-12 record.
- insert:
    - id: verify-t3-shell
      name: 'D:/DSH/work/dsh-native-daily/qualification/runners/verify-t3-shell.mjs'
