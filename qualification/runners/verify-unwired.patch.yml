# Overlay for the R3 unwired-capability boot probe.
#
# Loaded ON TOP of the `daily-candidate` profile, so the probe runs inside a real
# composed profile boot rather than a hand-mounted context.
#
# ONE row: the probe itself. The `daily-work-host` row is NOT restated here,
# unlike `verify-data-plane.patch.yml`, and the difference is deliberate:
#
#   - That probe restates `daily-data-plane` because the installed profile
#     carries a COPY of the package's `cordis.patch.yml`, and a stale copy would
#     make the probe report a false absence -- a measurement error about the
#     probe, not a finding about the product.
#   - This probe is measuring the SERVICE AS THE PROFILE INSTALLED IT, so
#     restating the row would REPLACE the installed row's config and change the
#     very thing under test. A probe that installs its own subject cannot
#     observe the product. If the row is missing from the installed bundle, the
#     probe must say so -- that absence IS the finding.
#
# The `webserver` override is a PROBE-ENVIRONMENT fact, not a product change:
# port 3080 is held by a long-lived host on this machine, and without the
# override the composed profile fails to boot for a reason that has nothing to
# do with the work service. Port 0 asks the OS for a free port.
#
# EVERY key is restated because a patch replaces the target row's whole `config`
# object -- it is not a deep merge (`vendor/include/src/index.ts:120-123`). This
# is TRAP 4 in `docs/OPERATIONS.md`, and it bit the data-plane probe on its first
# run: overriding only `port` dropped `host` and the boot failed schema
# validation.
- id: webserver
  config:
    host: '127.0.0.1'
    port: 0
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024

- insert:
    - id: verify-unwired
      name: 'REWRITTEN-AT-RUN-TIME/qualification/runners/verify-unwired.mjs'

# THIS FILE IS A TEMPLATE, NOT A RUNNABLE OVERLAY. The probe row's `name:` is a
# PLACEHOLDER rewritten at run time to the RUNNING tree's own probe file. A cordis
# `name:` is a MODULE SPECIFIER and an absolute one is imported as-is
# (`packages/boot/app-boot/src/index.ts:521`,
# `vendor/loader/src/config/tree.ts:122-126`), so a committed literal makes any
# other checkout's boot EXECUTE the main tree's probe -- cross-tree code execution.
# A relative `name:` is not a substitute: the loader resolves it against the
# PROFILE directory, not this file. See `qualification/runners/overlay.mjs`.
# TO RUN THIS OVERLAY, materialise it with the running tree's own probe:
#   import { materialiseOverlay } from './overlay.mjs'
#   materialiseOverlay('<this file>', '<your results dir>/x.patch.yml', '<your probe>.mjs')
# Running it AS-IS fails loudly with an unresolvable module, which is deliberate:
# a loud failure beats silently executing another checkout's probe.
