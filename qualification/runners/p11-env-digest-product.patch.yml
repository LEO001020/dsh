# Verification overlay for P11's composition-tier measurement.
#
# ONE row, and it is the PROBE ONLY. There is deliberately NO ipython service row
# here: the whole point of the case is what the `daily` profile's OWN composition
# registers. Adding a service row would prove the environment identity is
# manifest-derived when a row supplies it while proving nothing about the product
# -- the exact mistake recorded as G-FIX-04/G-FIX-05.
#
# THIS FILE IS A TEMPLATE, NOT A RUNNABLE OVERLAY. The `name:` below is a
# PLACEHOLDER and `p11-env-digest-driver.mjs` rewrites it at run time to this
# tree's own `p11-env-digest-product.mjs`, writing the result beside its own
# evidence.
#
# WHY, and this is a defect this project has already paid for twice. A cordis
# row's `name:` is a MODULE SPECIFIER, and the loader turns an absolute one into a
# `file://` URL and imports exactly that file
# (`packages/boot/app-boot/src/index.ts:521`,
# `vendor/loader/src/config/tree.ts:122-126`). A committed overlay carrying a
# literal path therefore makes a boot from ANY tree execute another writer's probe
# while believing it measured its own composition -- cross-tree CODE EXECUTION,
# not merely a cross-tree read. A relative `name:` is not a substitute: the loader
# resolves it against the PROFILE directory, not against this file.
#
# The driver uses the shared `materialiseOverlay` helper, which THROWS when this
# row is missing, so the placeholder cannot be silently dropped.
- insert:
    - id: p11-env-digest-product
      name: 'REWRITTEN-AT-RUN-TIME/p11-env-digest-product.mjs'
# TO RUN THIS OVERLAY, materialise it with the running tree's own probe:
#   import { materialiseOverlay } from './overlay.mjs'
#   materialiseOverlay('<this file>', '<your results dir>/x.patch.yml', '<your probe>.mjs')
# Running it AS-IS fails loudly with an unresolvable module, which is deliberate:
# a loud failure beats silently executing another checkout's probe.
