# The `standard` agent preset: the full coding agent, mounted once per process.
#
# This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
# standing scope; every session naming it joins by scope parentage, so the
# tools and prompt sections registered here cover each joined agent while a
# session's own state stays keyed per Session/Agent inside the plugins. The
# host composition (`base.cordis.yml` + `web.cordis.yml`) keeps everything a
# preset must not own: the registries themselves, the sandbox and approval
# stack, persistence, and the model route.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm, where it is process-global —
# another preset publishing the same name collides, and a host reader would
# resolve one preset's instance for every session; `dsh-agent-presets` rejects
# that at mount. `true` means an entry-local realm: this standing mount's own
# private instance, apart from every other preset's. (A shared label does NOT
# pool instances — `provide()` throws on the second registration under the
# same realm symbol; labels join REALMS, and are not what this file needs.)
#
# ── THIS FILE, NOT THE PROFILE PATCH, DECIDES THE MODEL'S TOOL SURFACE ───────
#
# The Web bundle moved the agent plane behind agent presets.
# `packages/bundle/web-app/cordis.patch.yml` DISABLES the host rows `tool-pwsh`,
# `tool-bash`, `tool-fs`, `tool-fs-search`, `tool-jobs`, `tool-skill`,
# `tool-subagent*`, `workflow-ptc`, `tool-workflow`, `tool-todo`, `tool-web`,
# `plan-mode`, `compaction-*` and `agent-instructions`, and lets the roster
# mount a preset per Session that composes them instead. The base keeps them
# because the TUI composes its agent process-wide; the Web surface disables them
# rather than deleting them, so a row cannot silently reappear if the
# composition is ever reordered.
#
# The mechanism is that `ctx.tools` layers are keyed by the AGENT OBJECT:
# `AgentLoop` builds the scope with `createScope(loopCtx, this)`
# (packages/core/agent-loop/src/agent.ts:104). A tool row mounted at HOST level
# publishes into the root realm, which no agent's scope selects, so the model
# gets the service and no way to call it — silently. That is Trap 7 in
# `docs/DELIVERY.md` and the reason `daily-work-tools` and `ipython-tool` live
# here at all.
#
# CONSEQUENCE, and it is the correction this file's edit is based on:
# **editing `profiles/daily-candidate/cordis.patch.yml` cannot change the
# model's tool surface.** That patch owns the host plane (the roster, the
# subagent capacity override, the sandbox and approval rows). This file owns
# what the model sees. A change to the tool face that is written anywhere else
# is a change to a plane the model does not read.
#
# ── IPYTHON IS THE PRIMARY PROGRAMMABLE EXECUTION SURFACE ───────────────────
#
# For this deployment (Windows, trusted-local, no sandbox — see
# `docs/decisions/AUDIT-REQUEST-nosandbox.md`) the model's execution surface is
# the persistent IPython kernel, and `ipython` is the ONE tool that reaches it.
# `tool-pwsh` is disabled in the shell section below; `tool-bash` keeps its
# shipped POSIX-only expression and is therefore inert here too.
#
# WHAT THAT DOES AND DOES NOT BUY.
#   - It DOES give the model one language with real state between cells: a
#     kernel that holds variables, imports, and open handles across calls, and
#     that can reach subprocesses, the filesystem and the network through
#     CPython rather than through a second tool schema.
#   - It DOES NOT confine anything. The kernel is unconfined, runs as the same
#     OS user, and has the same authority the shell had (G-SEAM-25). Removing
#     the shell row removes a second interface, not a capability. No part of
#     this file is a containment claim, and none may be cited as one.
#   - The native `fs` tools (`read`/`write`/`edit`/`read_image`, `grep`/`glob`)
#     STAY. They are not a redundant dialect: `read` carries offset/limit
#     paging, `edit` is an exact-match replacement that fails loudly rather than
#     writing a wrong file, and both are the path the workspace change feed and
#     the browser's file views observe. Reaching the same bytes through
#     `open()` in a cell would bypass that observation, so the native tools
#     remain the model's default for file work.

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    suffix: Your working directory is {{cwd}}.
    prefix: >-
      You are a coding agent powered by the {{model}} model.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────
#
# THE MODEL-FACING SHELL IS OFF ON THIS DEPLOYMENT, AND `ipython` REPLACES IT.
#
# The target architecture for this deployment is WINDOWS TRUSTED-LOCAL, with a
# PERSISTENT IPYTHON KERNEL as the model's primary programmable execution
# surface (`docs/decisions/AUDIT-REQUEST-nosandbox.md`, layer B). `tool-pwsh` is
# therefore disabled below, unconditionally.
#
# WHY `ipython` REPLACES A SHELL RATHER THAN SITTING BESIDE ONE. The kernel is a
# real CPython with its own pid, and `import subprocess` reaches every command
# PowerShell could run. Keeping both would present the model with TWO action
# dialects over the SAME OS authority, which costs schema tokens in every
# request and splits behaviour: a model that learned a task through `pwsh`
# cannot reuse it through `ipython`, and vice versa. One programmable surface
# removes the fork instead of documenting it.
#
# THIS IS NOT A SECURITY MEASURE, AND NOBODY SHOULD READ IT AS CONTAINMENT.
# Disabling this row does NOT reduce what the model can reach: the `ipython`
# kernel runs unconfined, as the same OS user, with the same file and network
# access a shell had (`docs/GAPS.md` G-SEAM-25). It removes a second interface,
# not a capability. Anyone who later wants containment must build it somewhere
# else and must not cite this row as evidence that any exists.
#
# WHY `tool-bash` IS LEFT EXACTLY AS SHIPPED. Its shipped expression enables it
# on POSIX, and this deployment is Windows, so the row is inert here either way.
# Changing it would be a POSIX claim with no POSIX evidence behind it — the
# "claim you did not measure" failure this repository records as G-FIX-04. The
# asymmetry is stated here so a reader sees it rather than inferring it.
#
# `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
# publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Behind a preset realm those variables
# never reached the model's shell at all.
#
# The `shell` SERVICE is unaffected by this row. It is provided by the
# host-plane executor rows (`pwsh-sandbox`/`bash-sandbox`, mounted by
# `@deepseek-ai/dsh-base`), and the host rows that consume it — the terminal
# controller, the permission stack — keep resolving it. What this file chooses
# is only whether the AGENT gets a model-facing shell tool.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: true

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in — `tool-bash`
# above resolves it with `ctx.get`, and an entry-local realm here is invisible
# to every sibling row, so `run_in_background` would answer "background jobs
# unavailable" while these controls sat in the catalog. The registry is keyed by
# owning agent anyway, so one host instance serves every session. What a preset
# chooses is whether its agent can collect and stop background work at all.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
# `skill-filesystem` contributes local-root discovery for agents on this preset, and
# `tool-skill` gives them the catalog and loader; the merged catalog also
# carries whatever the deployment registered globally (repository plugins).
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# The goal service and session driver stay on the host plane, where the Gateway
# can resolve them. The human command and model-facing tool register into this
# preset's scoped layers.
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance. It takes no configuration,
# keys every fold by Session, and owns the context-meter projection units the
# browser reads for every session — behind a realm those units would come and go
# with whichever presets happen to be mounted. What a preset chooses is whether
# its agent compacts at all, which is `compaction-basic` below.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition: the registry is a process singleton whose cross-session queries
# the api-proxy serves to the browser, and a provider name may only be
# registered once. This preset contributes the delegation TOOLS, which resolve
# that host registry.
#
# `workflows` is different — nothing outside an agent reads it — so every row
# that reaches it shares one entry-local realm here, and a consumer left
# outside would resolve a host registry this preset does not populate.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable

    # Fork omits model selection so provider/model stay equal to the parent and
    # the inherited history remains eligible for KV Cache reuse. This preset
    # keeps fork continuable; parent and child inherit the same messaging tool,
    # while the parent id and return guidance follow the inherited history.
    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Production dsh does not install these optional providers. Install the
    # matching Bundle in this Profile and restart the Host, then copy this
    # preset and remove `disabled` from the matching tool row. Host availability
    # alone grants no tool.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-ptc
      name: '@deepseek-ai/dsh-workflow-ptc'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    # Off by default with the base row it mirrors: the tool description
    # restricts `ralph` to runs the human explicitly asked for, and completion
    # is a worker self-report, not an independent evaluation. Preset files take
    # no patches, so a session that wants it duplicates this preset under a new
    # id and drops `disabled`; the shipped root shadows a copy that reuses this
    # id.
    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      disabled: true
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

- id: present
  name: '@deepseek-ai/dsh-tool-present'

- id: tool-plugin-manager
  name: '@deepseek-ai/dsh-plugin-manager/tools'
  disabled: true

# ── dsh-daily-work ──────────────────────────────────────────────────────────
#
# THE OTHER DIFFERENCE FROM THE SHIPPED `standard` PRESET: these two rows.
#
# WHY A PRESET ROW AND NOT A BUNDLE ROW. A tool is AGENT-SCOPED: `ctx.tools`
# layers are keyed by the Agent object, so a tool row mounted at host level
# publishes into the root realm where no agent's scope sees it. The model would
# then have a work service and no way to call it. The host half of each
# extension is mounted by its BUNDLE, once per host; only the agent-scoped
# consumer belongs here.
#
# This row is what puts the `work` tool in front of the model. Its guard
# (`dsh-daily-work/tool-protocol-guards`) is host-plane and comes from the
# bundle, because a guard registered through one agent's context would cover
# that agent only.
- id: daily-work-tools
  name: dsh-daily-work/tools

# The HUMAN command that authorizes a run (V3 phase R4, F1 / G-SEAM-31).
#
# WHY THIS ROW IS HERE AND NOT IN THE PROFILE PATCH. `ctx.commands` layers are
# keyed by the Agent object, exactly like `ctx.tools`: a command registered from
# the host plane publishes into the root realm, which no agent's scope selects,
# so the human would have a work service and no way to authorize a run — the same
# trap this file already documents for tools.
#
# WHAT IT ADDS. `/work start [N]`, `/work target N`, `/work stop`, `/work status`,
# registered through DSH's HUMAN command registry. Execution does NOT send the
# line to the model; `CommandRuntime` calls the handler directly and logs the
# lifecycle with `source.kind === 'user'`. That log is the durable evidence the
# run's `authorizationRef` names, which is what makes the authorization
# auditable instead of asserted.
- id: daily-work-command
  name: dsh-daily-work/command

# ── dsh-ipython ─────────────────────────────────────────────────────────────
#
# The model-facing `ipython` tool: ONE tool with ONE parameter (`code`). Kernel
# lifecycle stays on the host plane and is not reachable from here.
#
# MEASURED, and the reason this row is not optional: with the bundle mounted but
# this row absent, a real Session's catalog holds NO `ipython` entry. Evidence
# for the present case (row inserted) is
# qualification/results/M11-ipython/e2e-tool.json, which reports
# `ipythonParameterNames: ["code"]` and `ipythonIsOnlyParameter: true` inside a
# 28-tool agent-keyed catalog. The earlier evidence for this gate came from a
# VERIFICATION OVERLAY that inserted the row, which proved the tool worked
# without proving the product carried it -- the same weaker-oracle mistake
# recorded as G-FIX-04 and G-FIX-12.
#
# THIS ROW IS NOW THE DEPLOYMENT'S PRIMARY EXECUTION SURFACE, not one of two.
# See the shell section above for why the model-facing shell is off, and for the
# explicit statement that this is NOT containment.
- id: ipython-tool
  name: dsh-ipython/tool

# ── THE PTC / `workflow` DEPENDENCY CHAIN, RECORDED SO IT IS NOT BROKEN ─────
#
# There is NO `run_code` tool in this preset's catalog, and that is MEASURED
# rather than assumed: a real Session on this preset reports 28 tools and
# `run_code` is not among them (qualification/results/T4-preset/boot-before.json).
# The reason is that the `tools` registry's presentation mode is its schema
# default `native` — `packages/bundle/web-app/cordis.patch.yml` sets
# `mode: !!js process.env.DSH_TOOLS_MODE` and that variable is unset on this
# deployment, so no `run_code` transport is presented and no SDK prompt is
# assembled. **PTC is a mounted SERVICE here, not a model-facing surface.**
#
# That matters because a later reader could easily conclude the opposite from
# the presence of the `workflow` tool and try to "remove PTC" by deleting rows.
# The chain that must move TOGETHER is:
#
#   tool-workflow  injects workflowEngine
#   workflow-ptc   provides workflowEngine (PtcWorkflowEngine extends
#                  WorkflowEngine, whose constructor publishes `workflowEngine`)
#                  and injects ['subagents', 'ptcRuntime', 'sandboxPolicy']
#                  (packages/workflow/workflow-ptc/src/index.ts:103)
#   ptc-runtime    provides ptcRuntime and injects
#                  ['fs', 'subprocess', 'sandbox', 'sandboxPolicy']
#                  (packages/ptc-runtime/ptc-runtime-node/src/index.ts:53)
#
# `inject` is a READINESS GATE, not decoration. A row whose injected service
# never publishes stays PENDING forever, and `mountPreset` throws when ANY row
# is unusable (packages/preset/agent-presets/src/mount.ts:394-396) — the preset
# then fails to mount ENTIRELY and the model's tool face goes to zero. That
# all-or-nothing behaviour is MEASURED, not inferred: removing the sandbox rows
# produced `toolCount: 0` with `pwsh`, `ipython` and `work` all absent
# (Fact F in `docs/decisions/AUDIT-REQUEST-nosandbox.md`, and the
# `M12-deliverable-surface/surface-MINE.json` error field reproduces it).
#
# SO: `workflow-ptc` and `tool-workflow` can only leave as a PAIR, and only once
# `ptcRuntime` is no longer needed — which is when the IPython -> native-tool
# bridge is qualified and a cell can reach native tools without a `run_code`
# transport. That bridge is a different agent's work. Until it lands, the
# correct action is to leave these rows alone: deleting `workflow-ptc` alone
# would take `tool-workflow` pending with it, and deleting `ptc-runtime` alone
# would take `workflow-ptc` pending, and either way the whole preset unmounts.
#
# WHAT A LATER AGENT MUST VERIFY BEFORE REMOVING ANY OF IT:
#   1. the IPython -> native-tool bridge is qualified;
#   2. a boot probe on THIS preset reports a non-zero `toolCountAgentKey` with
#      the removed row's tool ABSENT — the count is what separates "removed"
#      from "the mount died";
#   3. zero "did not activate" lines at boot.
